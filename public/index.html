<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farah's Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e0e0e0; padding: 20px; }
.header { text-align: center; margin-bottom: 30px; }
.header h1 { font-size: 2.5em; margin-bottom: 10px; }
.tabs { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; border-bottom: 1px solid #333; padding-bottom: 15px; }
.tab-btn { background: none; border: none; color: #999; font-size: 1em; cursor: pointer; padding: 10px 0; font-weight: 600; }
.tab-btn.active { color: #6C7FE0; border-bottom: 2px solid #6C7FE0; }
.content { max-width: 900px; margin: 0 auto; }
.card { background: #1a1f2e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.card h2 { font-size: 1.2em; margin-bottom: 15px; }
.card ul { list-style: none; }
.card li { padding: 10px 0; border-bottom: 1px solid #333; }
.card li:last-child { border-bottom: none; }
.task-item { display: flex; gap: 15px; align-items: center; }
.task-done { opacity: 0.5; text-decoration: line-through; }
.category-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
.category-kids { background: #FF6B6B; color: white; }
.category-self { background: #8B7DC8; color: white; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>Farah</h1>
  <p style="color: #999; margin-top: 5px;">Mom's Dashboard</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('home')">HOME</button>
  <button class="tab-btn" onclick="switchTab('projects')">PROJECTS</button>
  <button class="tab-btn" onclick="switchTab('grocery')">GROCERY</button>
</div>

<div class="content">

  <!-- HOME TAB -->
  <div id="home-tab" class="tab-content">
    <div class="card">
      <h2>📋 Today's Tasks</h2>
      <ul id="todayTasks"></ul>
    </div>
    <div class="card">
      <h2>⏱️ Key Times</h2>
      <ul id="keyTimes"></ul>
    </div>
  </div>

  <!-- PROJECTS TAB -->
  <div id="projects-tab" class="tab-content hidden">
    <div class="card">
      <h2>🎯 Active Projects</h2>
      <ul id="projectsList"></ul>
    </div>
  </div>

  <!-- GROCERY TAB -->
  <div id="grocery-tab" class="tab-content hidden">
    <div class="card">
      <h2>🛒 Costco Shopping List</h2>
      <ul id="groceryList"></ul>
    </div>
  </div>

</div>

<script>
// Simple data storage
const data = {
  tasks: [
    { id: 1, title: 'Kids buy pumpkins', category: 'kids', done: true },
    { id: 2, title: 'Bath & sleep', category: 'kids', done: true, time: '7:00 PM' },
    { id: 3, title: 'School pick up', category: 'kids', done: true },
    { id: 4, title: 'Arabic Quran game', category: 'kids', done: true, time: '6:30 PM' },
    { id: 5, title: 'Numberblocks', category: 'kids', done: true, time: '6:15 PM' }
  ],
  projects: [
    { id: 1, name: 'Islamic Explorer (Lovable)' },
    { id: 2, name: 'World Mastery Game' },
    { id: 3, name: 'Cooking Game with Teta' },
    { id: 4, name: 'Apple Picking Outing' },
    { id: 5, name: 'Baby Clothes Quilt' },
    { id: 6, name: 'Dashboard Brain Dump' },
    { id: 7, name: 'Summer 2026 Picture Book' }
  ],
  grocery: [
    'Stone field yogurt pouches',
    'Yogurt pouches',
    'Strawberries',
    'Ground beef',
    'Item 5',
    'Item 6'
  ],
  keyTimes: [
    'Yousef nap: max 90 min',
    'Leave for pickup: 2:30 PM',
    'School pickup: 3:00 PM',
    'Arabic Quran game: 6:30 PM',
    'Bath & bedtime: 7:00 PM'
  ]
};

function render() {
  // Render today's tasks
  const todayTasks = document.getElementById('todayTasks');
  todayTasks.innerHTML = data.tasks.map(t => `
    <li class="task-item ${t.done ? 'task-done' : ''}">
      <span class="category-badge category-${t.category}">${t.category}</span>
      <span>${t.title} ${t.time ? `<small style="color: #999;">(${t.time})</small>` : ''}</span>
    </li>
  `).join('');

  // Render key times
  const keyTimes = document.getElementById('keyTimes');
  keyTimes.innerHTML = data.keyTimes.map(kt => `<li>⏰ ${kt}</li>`).join('');

  // Render projects
  const projectsList = document.getElementById('projectsList');
  projectsList.innerHTML = data.projects.map(p => `<li>✓ ${p.name}</li>`).join('');

  // Render grocery
  const groceryList = document.getElementById('groceryList');
  groceryList.innerHTML = data.grocery.map(g => `<li>☐ ${g}</li>`).join('');
}

function switchTab(tabName) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  // Show selected tab
  document.getElementById(tabName + '-tab').classList.remove('hidden');
  // Update button styles
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

// Initial render
render();
</script>

</body>
</html>
